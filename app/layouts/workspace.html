<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Workspace — TRƯỜNG YÊN FOOD OS</title>

    <link rel="stylesheet" href="../app.css">
    <link rel="stylesheet" href="../components/workspace.css">

</head>


<body>

    <div class="workspace-shell">


        <!-- =========================================
             HEADER
             ========================================= -->

        <header class="workspace-header">

            <a
                href="../index.html"
                class="workspace-brand"
                data-nav-home
            >

                <span class="workspace-brand-mark">
                    TY
                </span>

                <span class="workspace-brand-name">
                    TRƯỜNG YÊN FOOD
                </span>

                <span class="workspace-brand-os">
                    OS
                </span>

            </a>


            <div class="workspace-header-actions">

                <button
                    class="workspace-search"
                    type="button"
                    aria-label="Tìm kiếm"
                >

                    🔍

                    <span>
                        Tìm kiếm...
                    </span>

                </button>


                <button
                    class="workspace-notification"
                    type="button"
                    aria-label="Thông báo"
                >

                    🔔

                </button>


                <div class="workspace-user">

                    <span class="workspace-avatar">
                        T
                    </span>

                    <span>
                        Tuấn
                    </span>

                </div>

            </div>

        </header>



        <!-- =========================================
             BODY
             ========================================= -->

        <div class="workspace-body">


            <!-- =====================================
                 SIDEBAR
                 ===================================== -->

            <aside
                class="workspace-sidebar"
                aria-label="Điều hướng hệ thống"
            >

                <div class="workspace-sidebar-title">
                    HỆ THỐNG
                </div>


                <!-- DASHBOARD -->

                <a
                    href="../index.html"
                    class="workspace-nav-item"
                    data-workspace="dashboard"
                >

                    <span>
                        ⌂
                    </span>

                    <span>
                        Dashboard
                    </span>

                </a>


                <!-- KNOWLEDGE -->

                <a
                    href="knowledge.html"
                    class="workspace-nav-item"
                    data-workspace="knowledge"
                >

                    <span>
                        ◈
                    </span>

                    <span>
                        Knowledge
                    </span>

                </a>


                <!-- COMPANY -->

                <a
                    href="company.html"
                    class="workspace-nav-item"
                    data-workspace="company"
                >

                    <span>
                        ▣
                    </span>

                    <span>
                        Company
                    </span>

                </a>


                <!-- BRAND -->

                <a
                    href="brand.html"
                    class="workspace-nav-item"
                    data-workspace="brand"
                >

                    <span>
                        ◇
                    </span>

                    <span>
                        Brand
                    </span>

                </a>


                <!-- PRODUCTS -->

                <a
                    href="products.html"
                    class="workspace-nav-item"
                    data-workspace="products"
                >

                    <span>
                        □
                    </span>

                    <span>
                        Products
                    </span>

                </a>


                <!-- QA GATE -->

                <a
                    href="qa.html"
                    class="workspace-nav-item"
                    data-workspace="qa"
                >

                    <span>
                        ✓
                    </span>

                    <span>
                        QA GATE
                    </span>

                </a>


            </aside>



            <!-- =====================================
                 MAIN
                 ===================================== -->

            <main class="workspace-main">

                <div class="workspace-container">


                    <!-- =================================
                         BREADCRUMB
                         ================================= -->

                    <nav
                        class="workspace-breadcrumb"
                        aria-label="Breadcrumb"
                    >

                        <a
                            href="../index.html"
                            data-nav-home
                        >
                            Dashboard
                        </a>

                        <span>
                            /
                        </span>

                        <span
                            class="workspace-breadcrumb-current"
                            data-breadcrumb-current
                        >
                            Workspace
                        </span>

                    </nav>



                    <!-- =================================
                         PAGE HEADER
                         ================================= -->

                    <header class="workspace-page-header">

                        <div>

                            <span class="workspace-eyebrow">
                                TRƯỜNG YÊN FOOD OS
                            </span>


                            <h1
                                data-workspace-title
                            >
                                Workspace
                            </h1>


                            <p
                                data-workspace-description
                            >
                                Không gian làm việc của hệ thống.
                            </p>

                        </div>


                        <div class="workspace-actions">


                            <button
                                class="workspace-action secondary"
                                type="button"
                                data-nav-back
                            >
                                Quay lại
                            </button>


                            <button
                                class="workspace-action primary"
                                type="button"
                                data-new-task
                            >
                                Tác vụ mới
                            </button>


                        </div>

                    </header>



                    <!-- =================================
                         CONTENT
                         ================================= -->

                    <section
                        class="workspace-content"
                        data-workspace-content
                    >

                        <div class="workspace-placeholder">

                            <span class="workspace-placeholder-icon">
                                ◈
                            </span>


                            <h2>
                                Workspace Content
                            </h2>


                            <p>
                                Nội dung hệ thống sẽ được đặt tại đây.
                            </p>

                        </div>

                    </section>


                </div>

            </main>


        </div>

    </div>


</body>

</html>
