<script>

(function () {

    "use strict";


    function loadTasks() {

        let tasks = [];


        try {

            tasks =
                JSON.parse(
                    localStorage.getItem(
                        "ty-tasks"
                    ) || "[]"
                );

        }
        catch (error) {

            tasks = [];

        }


        const groups = {

            DRAFT:
                document.getElementById(
                    "tasks-draft"
                ),

            "IN PROGRESS":
                document.getElementById(
                    "tasks-progress"
                ),

            "QA / REVIEW":
                document.getElementById(
                    "tasks-review"
                ),

            DONE:
                document.getElementById(
                    "tasks-done"
                )

        };


        const counts = {

            DRAFT:
                document.getElementById(
                    "count-draft"
                ),

            "IN PROGRESS":
                document.getElementById(
                    "count-progress"
                ),

            "QA / REVIEW":
                document.getElementById(
                    "count-review"
                ),

            DONE:
                document.getElementById(
                    "count-done"
                )

        };


        Object.values(groups)
            .forEach(function (container) {

                container.innerHTML = "";

            });


        Object.keys(groups)
            .forEach(function (status) {

                const filtered =
                    tasks.filter(
                        function (task) {

                            return task.status === status;

                        }
                    );


                counts[status].textContent =
                    filtered.length;


                if (!filtered.length) {

                    groups[status].innerHTML = `

                        <div class="task-empty">
                            Chưa có tác vụ
                        </div>

                    `;

                    return;

                }


                groups[status].innerHTML =
                    filtered
                        .map(function (task) {

                            return `

                                <article class="task-card">

                                    <span class="task-card-id">
                                        ${task.id}
                                    </span>

                                    <strong>
                                        ${task.typeTitle}
                                    </strong>

                                    <span>
                                        Hệ thống:
                                        ${task.workspaceTitle}
                                    </span>

                                    <span>
                                        Trạng thái:
                                        ${task.status}
                                    </span>

                                </article>

                            `;

                        })
                        .join("");

            });


        document.getElementById(
            "task-count"
        ).textContent =
            tasks.length +
            (
                tasks.length === 1
                    ? " tác vụ"
                    : " tác vụ"
            );

    }


    loadTasks();


    window.addEventListener(
        "storage",
        loadTasks
    );


    window.addEventListener(
        "ty-task-created",
        loadTasks
    );


})();

</script>

<script>

(function () {

    "use strict";


    const params =
        new URLSearchParams(
            window.location.search
        );


    const taskId =
        params.get("task");


    if (!taskId) {
        return;
    }


    function findTaskElement() {

        const elements =
            document.querySelectorAll(
                "body *"
            );


        for (
            const element of elements
        ) {

            if (
                element.children.length === 0 &&
                element.textContent.includes(taskId)
            ) {

                return element;

            }

        }


        return null;

    }


    function findCard(element) {

        let current =
            element;


        for (
            let i = 0;
            i < 6 && current;
            i++
        ) {

            if (
                current.matches &&
                current.matches(
                    "[data-task-card], " +
                    ".task-card, " +
                    ".task-item, " +
                    ".task-board-card, " +
                    "article, " +
                    "li"
                )
            ) {

                return current;

            }


            current =
                current.parentElement;

        }


        return element.parentElement ||
               element;

    }


    function highlightTask() {

        const element =
            findTaskElement();


        if (!element) {
            return false;
        }


        const card =
            findCard(element);


        card.classList.add(
            "ty-task-new-highlight"
        );


        card.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });


        return true;

    }


    let attempts = 0;


    const timer =
        setInterval(
            function () {

                attempts++;


                if (
                    highlightTask() ||
                    attempts >= 30
                ) {

                    clearInterval(timer);

                }

            },
            100
        );


    /*
     * Giữ URL sạch sau khi đã xử lý.
     */

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );


})();

</script>

<script>

    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function getTasks() {

        try {

            return JSON.parse(
                localStorage.getItem("ty-tasks") || "[]"

        catch (error) {

    function saveTasks(tasks) {

        localStorage.setItem(
            "ty-tasks",
            JSON.stringify(tasks)
        );

    }


    function getTaskById(id) {

        return getTasks().find(
            function (task) {

                return task.id === id;

            }
        );

        try {

                </footer>

            </div>

        `;


        document.body.appendChild(overlay);


        overlay.addEventListener(
            "click",
            function (event) {

                if (
                    event.target.closest(
                        "[data-detail-close]"
                    )
                ) {

                    closeDetail();

                    return;

                }


                if (
                    event.target.closest(
                        "[data-task-start]"
                    )
                ) {

                    startCurrentTask();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    closeDetail();

                }

            }
        );

    }


    let currentTaskId = null;


    function openDetail(taskId) {

        const task =
            getTaskById(taskId);


        if (!task) {

            return;

        }


        createDetailModal();


        currentTaskId =
            task.id;


        const overlay =
            document.getElementById(
                "ty-task-detail-overlay"
            );


        overlay.querySelector(
            "[data-detail-title]"
        ).textContent =
            task.typeTitle || task.type;


        overlay.querySelector(
            "[data-detail-id]"
        ).textContent =
            task.id;


        overlay.querySelector(
            "[data-detail-status]"
        ).textContent =
            task.status || "DRAFT";


        overlay.querySelector(
            "[data-detail-type]"
        ).textContent =
            task.typeTitle || task.type;


        overlay.querySelector(
            "[data-detail-workspace]"
        ).textContent =
            task.workspaceTitle || task.workspace;


        overlay.querySelector(
            "[data-detail-created]"
        ).textContent =
            formatDate(task.createdAt);


        overlay.querySelector(
            "[data-detail-code]"
        ).textContent =
            task.id;


        const startButton =
            overlay.querySelector(
                "[data-task-start]"
            );


        if (
            task.status === "DRAFT"
        ) {

            startButton.disabled = false;

            startButton.textContent =
                "Bắt đầu xử lý";

            startButton.style.display =
                "";

            startButton.classList.remove(
                "qa-review-action"
            );

        }
        else if (
            task.status === "IN PROGRESS"
        ) {

            startButton.disabled = false;

            startButton.textContent =
                "Đưa vào QA / Review";

            startButton.style.display =
                "";

            startButton.classList.add(
                "qa-review-action"
            );

        }
        else if (
            task.status === "QA / REVIEW"
        ) {

            startButton.disabled = false;

            startButton.textContent =
                "Hoàn tất tác vụ";

            startButton.style.display =
                "";

            startButton.classList.add(
                "qa-review-action"
            );

        }
        else {

            startButton.style.display =
                "none";

        }


        overlay.classList.add(
            "is-open"
        );


        document.body.classList.add(
            "ty-task-open"
        );

    }


    function closeDetail() {

        const overlay =
            document.getElementById(
                "ty-task-detail-overlay"
            );


        if (!overlay) {

            return;

        }


        overlay.classList.remove(
            "is-open"
        );


        document.body.classList.remove(
            "ty-task-open"
        );


        currentTaskId = null;

    }


    function startCurrentTask() {

        if (!currentTaskId) {

            return;

        }


        const tasks =
            getTasks();


        const index =
            tasks.findIndex(
                function (task) {

                    return task.id === currentTaskId;

                }
            );


        if (index === -1) {

            return;

        }


        if (
            tasks[index].status === "DRAFT"
        ) {

            tasks[index].status =
                "IN PROGRESS";

            tasks[index].startedAt =
                new Date().toISOString();

        }
        else if (
            tasks[index].status === "IN PROGRESS"
        ) {

            tasks[index].status =
                "QA / REVIEW";

            tasks[index].qaReviewAt =
                new Date().toISOString();

        }
        else if (
            tasks[index].status === "QA / REVIEW"
        ) {

            tasks[index].status =
                "DONE";

            tasks[index].completedAt =
                new Date().toISOString();

        }
        else {

            return;

        }


        saveTasks(tasks);


        closeDetail();


        window.location.reload();

    }


    function findTaskIdFromTarget(target) {

        let current =
            target;


        for (
            let i = 0;
            i < 8 &&
            current &&
            current !== document.body;
            i++
        ) {

            const text =
                current.textContent || "";


            const match =
                text.match(
                    /TASK-\d+/
                );


            if (match) {

                return match[0];

            }


            current =
                current.parentElement;

        }


        return null;

    }


    function markTaskCards() {

        const all =
            document.querySelectorAll(
                "body *"
            );


        all.forEach(
            function (element) {

                if (
                    element.children.length === 0 &&
                    /^TASK-\d+$/.test(
                        element.textContent.trim()
                    )
                ) {

                    let card =
                        element.parentElement;


                    for (
                        let i = 0;
                        i < 5 &&
                        card &&
                        card !== document.body;
                        i++
                    ) {

                        if (
                            card.children.length >= 2
                        ) {

                            card.setAttribute(
                                "data-ty-task-card",
                                "true"
                            );

                            break;

                        }


                        card =
                            card.parentElement;

                    }

                }

            }
        );

    }


    document.addEventListener(
        "click",
        function (event) {

            if (
                event.target.closest(
                    "#ty-task-detail-overlay"
                )
            ) {

                return;

            }


            const taskId =
                findTaskIdFromTarget(
                    event.target
                );


            if (!taskId) {

                return;

            }


            const task =
                getTaskById(taskId);


            if (!task) {

                return;

            }


            event.preventDefault();
            event.stopPropagation();


            openDetail(taskId);

        },
        true
    );


    function initializeTaskDetail() {

        markTaskCards();

    }


    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeTaskDetail
        );

    }
    else {

        initializeTaskDetail();

    }


})();

</script>


<!-- =====================================================
     TY_TASK_QA_REVIEW_V1
     IN PROGRESS -> QA / REVIEW
     ===================================================== -->

<style id="ty-task-qa-review-style">

    .ty-task-detail-button.qa-review-action {

        background:
            var(--brand, #795548);

        color: white;

    }


    .ty-task-detail-button.qa-review-action:hover {

        background:
            var(--brand-dark, #5d4037);

    }

</style>


<script>

(function () {

    "use strict";


    const STORAGE_KEY = "ty-tasks";


    function getTasks() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                ) || "[]"
            );

        }
        catch (error) {

            return [];

        }

    }


    function saveTasks(tasks) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tasks)
        );

    }


    function getCurrentTaskId() {

        const idElement =
            document.querySelector(
                "[data-detail-id]"
            );


        if (!idElement) {

            return null;

        }


        return idElement.textContent.trim();

    }


    function getCurrentTask() {

        const id =
            getCurrentTaskId();


        if (!id) {

            return null;

        }


        return getTasks().find(
            function (task) {

                return task.id === id;

            }
        ) || null;

    }


    function configureActionButton() {

        const overlay =
            document.getElementById(
                "ty-task-detail-overlay"
            );


        if (!overlay) {

            return;

        }


        if (
            !overlay.classList.contains(
                "is-open"
            )
        ) {

            return;

        }


        const button =
            overlay.querySelector(
                "[data-task-start]"
            );


        if (!button) {

            return;

        }


        const task =
            getCurrentTask();


        if (!task) {

            return;

        }


        if (
            task.status === "IN PROGRESS"
        ) {

            button.disabled = false;

            button.style.display = "";

            button.textContent =
                "Đưa vào QA / Review";

            button.classList.add(
                "qa-review-action"
            );

            return;

        }


        if (
            task.status === "QA / REVIEW"
        ) {

            button.disabled = false;

            button.style.display = "";

            button.textContent =
                "Hoàn tất tác vụ";

            button.classList.add(
                "qa-review-action"
            );

            return;

        }


        button.classList.remove(
            "qa-review-action"
        );

    }


    function moveCurrentTaskToQA() {

        const task =
            getCurrentTask();


        if (!task) {

            return;

        }


        if (
            task.status !== "IN PROGRESS"
        ) {

            return;

        }


        const tasks =
            getTasks();


        const index =
            tasks.findIndex(
                function (item) {

                    return item.id === task.id;

                }
            );


        if (index === -1) {

            return;

        }


        tasks[index].status =
            "QA / REVIEW";


        tasks[index].qaReviewAt =
            new Date().toISOString();


        saveTasks(tasks);


        window.location.reload();

    }


    document.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    "[data-task-start]"
                );


            if (!button) {

                return;

            }


            const task =
                getCurrentTask();


            if (!task) {

                return;

            }


            if (
                task.status !== "IN PROGRESS"
            ) {

                return;

            }


            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();


            moveCurrentTaskToQA();

        },
        true
    );


    const observer =
        new MutationObserver(
            function () {

                configureActionButton();

            }
        );


    function initializeQAReview() {

        const overlay =
            document.getElementById(
                "ty-task-detail-overlay"
            );


        if (!overlay) {

            return;

        }


        observer.observe(
            overlay,
            {
                attributes: true,
                attributeFilter: [
                    "class"
                ],
                subtree: true
            }
        );


        configureActionButton();

    }


    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeQAReview
        );

    }
    else {

        initializeQAReview();

    }


})();

</script>
