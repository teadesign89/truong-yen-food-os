<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company — TRƯỜNG YÊN FOOD OS</title>
    <link rel="stylesheet" href="../app.css">
    <link rel="stylesheet" href="../components/workspace.css">
</head>

<body>
    <div id="workspace-root"></div>

    <script>
        const KNOWLEDGE_ROOT = "http://127.0.0.1:8000/systems/";

        fetch("../layouts/workspace.html")
            .then((response) => {
                if (!response.ok) {
                    throw new Error("Không thể tải Workspace Shell.");
                }
                return response.text();
            })
            .then((html) => {
                const parser = new DOMParser();
                const documentFragment = parser.parseFromString(html, "text/html");
                const shell = documentFragment.querySelector(".workspace-shell");

                if (!shell) {
                    throw new Error("Không tìm thấy Workspace Shell.");
                }

                const root = document.getElementById("workspace-root");
                root.appendChild(shell);

                const pageTitle = shell.querySelector(".workspace-page-header h1");
                const pageDescription = shell.querySelector(".workspace-page-header p");
                const breadcrumb = shell.querySelector(".workspace-breadcrumb span:last-child");

                if (pageTitle) pageTitle.textContent = "Company";
                if (pageDescription) pageDescription.textContent = "Trung tâm quản trị doanh nghiệp của TRƯỜNG YÊN FOOD OS.";
                if (breadcrumb) breadcrumb.textContent = "Company";

                const navigation = shell.querySelectorAll(".workspace-nav-item");
                navigation.forEach((item) => {
                    item.classList.remove("active");
                    if (item.textContent.trim().includes("Company")) {
                        item.classList.add("active");
                    }
                });

                const content = shell.querySelector(".workspace-content");
                if (!content) {
                    throw new Error("Không tìm thấy vùng Workspace Content.");
                }

                content.innerHTML = `
                    <div class="knowledge-overview">
                        <div class="knowledge-intro">
                            <span class="workspace-eyebrow">COMPANY PLATFORM</span>
                            <h2>Nguồn thông tin doanh nghiệp chính thức</h2>
                            <p>
                                Truy cập trực tiếp vào các tài liệu chính thức quản trị TRƯỜNG YÊN FOOD.
                            </p>
                        </div>

                        <div class="knowledge-section">
                            <div class="knowledge-section-heading">
                                <div>
                                    <span class="section-eyebrow">CORE COMPANY</span>
                                    <h3>Hồ sơ doanh nghiệp</h3>
                                </div>
                            </div>

                            <div class="knowledge-grid">
                                <a href="${KNOWLEDGE_ROOT}company-profile/" class="knowledge-card">
                                    <span class="knowledge-card-icon">□</span>
                                    <strong>Company Profile</strong>
                                    <span>Hồ sơ giới thiệu chính thức</span>
                                </a>

                                <a href="${KNOWLEDGE_ROOT}enterprise-constitution/" class="knowledge-card">
                                    <span class="knowledge-card-icon">◈</span>
                                    <strong>Enterprise Constitution</strong>
                                    <span>Hiến pháp và nguyên tắc doanh nghiệp</span>
                                </a>

                                <a href="${KNOWLEDGE_ROOT}brand-system/" class="knowledge-card">
                                    <span class="knowledge-card-icon">◇</span>
                                    <strong>Brand System</strong>
                                    <span>Định hướng thương hiệu</span>
                                </a>
                            </div>
                        </div>

                        <div class="knowledge-section">
                            <div class="knowledge-section-heading">
                                <div>
                                    <span class="section-eyebrow">COMPANY GOVERNANCE</span>
                                    <h3>Quản trị doanh nghiệp</h3>
                                </div>
                            </div>

                            <div class="knowledge-list">
                                <a href="${KNOWLEDGE_ROOT}enterprise-constitution/" class="knowledge-list-item">
                                    <strong>Enterprise Constitution</strong>
                                    <span>Nguyên tắc định hướng và ra quyết định</span>
                                </a>

                                <a href="${KNOWLEDGE_ROOT}company-profile/" class="knowledge-list-item">
                                    <strong>Company Profile</strong>
                                    <span>Thông tin nhận diện và hồ sơ doanh nghiệp</span>
                                </a>

                                <a href="${KNOWLEDGE_ROOT}brand-system/" class="knowledge-list-item">
                                    <strong>Brand System</strong>
                                    <span>Quản trị định vị và tài sản thương hiệu</span>
                                </a>
                            </div>
                        </div>

                        <div class="knowledge-section">
                            <div class="knowledge-section-heading">
                                <div>
                                    <span class="section-eyebrow">COMPANY PRINCIPLE</span>
                                    <h3>Một nguồn thông tin chính thức</h3>
                                </div>
                            </div>

                            <p>
                                TRƯỜNG YÊN FOOD OS không sao chép thông tin doanh nghiệp vào giao diện ứng dụng.
                            </p>
                            <p>
                                Các tài liệu chính thức được quản lý tại MkDocs và được Company Workspace truy cập trực tiếp.
                            </p>
                            <p>
                                <strong>Docs là nguồn sự thật.</strong>
                                App là lớp trải nghiệm.
                            </p>
                        </div>
                    </div>
                `;
            })
            .catch((error) => {
                console.error("Không thể tải Company Workspace:", error);
                document.getElementById("workspace-root").innerHTML = `
                    <div style="padding: 40px; font-family: Arial, sans-serif;">
                        <h2>Không thể tải Company Workspace</h2>
                        <p>Vui lòng kiểm tra Workspace Shell và máy chủ Knowledge Documentation.</p>
                    </div>
                `;
            });
    </script>
<script src="../app.js"></script>
<script src="../task.js"></script>
</body>

</html>
