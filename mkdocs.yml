site_name: TRƯỜNG YÊN FOOD OS
site_description: Enterprise Knowledge Operating System
site_author: Con cháu họ Đặng - Trường Yên - Hoa Lư - Ninh Bình

theme:
  name: material
  language: vi

  palette:
    - scheme: default
      primary: brown
      accent: amber

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Dashboard: index.md
  - Nền tảng:
      - Enterprise Constitution: systems/enterprise-constitution.md
      - Brand System: systems/brand-system.md
      - Company Profile: systems/company-profile.md
      - Knowledge Base: systems/knowledge-base.md
  - Vận hành & chất lượng:
      - QA GATE: systems/qa-gate.md
      - Product System: systems/product-system.md
      - Packaging: systems/packaging.md
      - Production: systems/production.md
      - Supply Chain: systems/supply-chain.md
  - Quản trị & tăng trưởng:
      - Marketing: systems/marketing.md
      - Finance: systems/finance.md
      - Legal: systems/legal.md
      - AI Knowledge: systems/ai-knowledge.md
